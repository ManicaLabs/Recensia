# Validation à chaque push et pull request (CDC §12) : aucun build, aucun déploiement.
# Le déploiement se fait par GitHub Pages depuis la branche main.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validation (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Contrôles statiques (syntaxe, JSON, HTML, secrets, précache, interdits, i18n)
        run: node tools/check.mjs

      - name: Tests
        run: node --test
